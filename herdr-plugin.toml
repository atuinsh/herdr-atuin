id = "atuin.threads"
name = "Atuin threads"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Resume agent panes through Atuin threads after a Herdr restart"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "report.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "report.sh"]
